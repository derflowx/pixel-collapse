<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Pixel Collapse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: black stage + inspector rail on top, full-width timeline strip below. Single dark look by choice. */
:root {
  --bg: #000;
  --panel: #0b0b0c;
  --raise: #16171a;
  --raise2: #24262c;
  --line: #24252a;
  --fg: #f2f2f2;
  --muted: #8a8b90;
  --accent: #ffffff;
  --hover: #ffffff26;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 12px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) auto; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 12px; color: var(--muted); font-size: 11px; letter-spacing: .04em; pointer-events: none; }
.insp { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tlwrap { grid-column: 1 / -1; background: var(--panel); border-top: 1px solid var(--line); padding-block: 8px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tlbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tlbar .sep { width: 1px; height: 20px; background: var(--line); margin-inline: 4px; }
.tlbar .lbl { color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 13ch; }
.tlscroll { overflow-x: auto; overflow-y: hidden; border: 1px solid var(--line); background: var(--bg); }
#track { position: relative; height: 100px; touch-action: none; user-select: none; -webkit-user-select: none; min-width: 100%; }
.ruler { position: absolute; left: 0; right: 0; top: 0; height: 20px; border-bottom: 1px solid var(--line); cursor: text; }
.tick { position: absolute; top: 0; height: 20px; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding-left: 3px; line-height: 20px; pointer-events: none; }
.tick.minor { height: 5px; top: 15px; }
.blk { position: absolute; top: 28px; height: 62px; box-sizing: border-box; border: 1px solid var(--line); overflow: hidden; padding: 5px 6px; display: flex; flex-direction: column; gap: 2px; }
.blk .bt { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
.blk .bs { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bd { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: auto; }
.clip { background: var(--raise); cursor: grab; }
.trans { background: repeating-linear-gradient(135deg, var(--raise) 0 5px, var(--bg) 5px 10px); cursor: pointer; align-items: center; justify-content: flex-end; }
.off { background: repeating-linear-gradient(45deg, var(--bg) 0 4px, var(--raise) 4px 8px); cursor: grab; align-items: center; padding: 5px 2px; }
.off .bt { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); }
.blk.sel { border-color: var(--accent); }
.clip.sel { background: var(--raise2); }
.blk.dragging { opacity: .4; }
.grip { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: ew-resize; }
.grip:hover, .grip.on { background: var(--hover); }
.phead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); pointer-events: none; }
.drop { position: absolute; top: 24px; bottom: 4px; width: 2px; background: var(--accent); pointer-events: none; }
h1 { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group > .label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
textarea, input[type=text], input[type=number] { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--line); font: 13px/1.3 var(--mono); padding: 7px 8px; }
textarea { min-height: 64px; resize: vertical; }
textarea:focus, input:focus-visible, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.row output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 5ch; text-align: right; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); font: 12px var(--mono); padding: 4px 6px; max-width: 170px; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); font: 12px var(--mono); padding: 5px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; min-width: 7ch; }
.hint { color: var(--muted); font-size: 10px; line-height: 1.5; }
.status { color: var(--fg); font-size: 11px; min-height: 1.4em; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 46vh auto auto; height: auto; min-height: 100%; }
  .tlwrap { grid-row: 2; }
  .insp { grid-row: 3; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud"></div>
  </div>
  <aside class="insp" id="insp"></aside>
  <section class="tlwrap">
    <div class="tlbar">
      <button class="primary" id="play">Pause</button>
      <button id="restart">Restart</button>

      <label class="check"><input type="checkbox" id="loop" checked> Loop</label>
      <span class="sep"></span>
      <span class="lbl">Add</span>
      <button data-add="text">Text</button>
      <button data-add="cipher">Cipher</button>
      <button data-add="image">Image</button>
      <button data-add="squares">Squares</button>
      <button data-add="bigsquare">Big square</button>
      <span class="sep"></span>
      <label class="check" for="zoom">Zoom</label>
      <input type="range" id="zoom" min="20" max="300" value="80" style="width:110px;accent-color:var(--accent)">
      <button id="fit">Fit</button>
    </div>
    <div class="tlscroll" id="tlscroll"><div id="track"></div></div>
    <div class="hint">Click a block to edit it · drag a block to reorder · drag its right edge to change duration · click the ruler to scrub · Space play/pause · Delete removes the selected block</div>
  </section>
</div>
<input type="file" id="imgFile" accept="image/*" hidden>
<input type="file" id="sceneFile" accept=".json,application/json" hidden>

<script>

const FONT2 = "00000000000000000000000000000000000000000808000808080808080800000000000008083e494848493e08080000000000000e1010107c1010103e6100000000000000423c244242243c4200000000000000412214087f087f080808000000000000080808080000080808080000000000003c42403c42423c02423c000024240000000000000000000000000000000000003c4299a5a1a1a599423c000000001c021e221e003e0000000000000000000000001212242448242412120000000000000000000000007e020202000000000000000000000000000000000000000000003c42b9a5a5b9a9a5423c000000007e0000000000000000000000000000000000182424180000000000000000000000000808087f080808007f0000000000003844041820407c000000000000000000384404380444380000000000000004081000000000000000000000000000000000000042424242424266594080000000003f7a7a7a3a0a0a0a0a0a0a0000000000000000001818000000000000000000000000000000000000000008300000001030501010107c00000000000000001c2222221c003e000000000000000000000000484824241224244848000000000000226224282812162a4e420000000000002262242828141a22444e000000000000621224186812162a4e420000000000001010001010204042423c0000300c000018242442427e4242424200000c30000018242442427e4242424200001824000018242442427e424242420000324c000018242442427e4242424200002424000018242442427e4242424200001824180018242442427e424242420000000000001f2848487f484848484f0000000000003c42424040404042423c0830300c00007e4040407c404040407e00000c3000007e4040407c404040407e0000182400007e4040407c404040407e0000242400007e4040407c404040407e0000180600003e08080808080808083e00000c3000003e08080808080808083e0000182400003e08080808080808083e0000242400003e08080808080808083e00000000000078444242f242424244780000324c000042626252524a4a4646420000300c00003c42424242424242423c00000c3000003c42424242424242423c0000182400003c42424242424242423c0000324c00003c42424242424242423c0000242400003c42424242424242423c000000000000000000422418244200000000000000023a44464a4a525262225c4000300c00004242424242424242423c00000c3000004242424242424242423c0000182400004242424242424242423c0000242400004242424242424242423c00000c3000004141222214080808080800000 const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), track = $('track');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function glyphRows(ch) {
  let c = ch.charCodeAt(0), src = FONT, o;
  if (c >= 160 && c <= 255) { src = FONT2; o = (c - 160) * 32; }
  else { if (c < 32 || c > 126) c = 63; o = (c - 32) * 32; }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const EASE = {
  cubic: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  expo: u => u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2,
  quad: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  linear: u => u,

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const num = (v, d, lo, hi) => { v = parseFloat(v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };

// ================= scene model =================
const TYPES = { text: 'Text', cipher: 'Cipher', image: 'Image', squares: 'Squares', bigsquare: 'Big square' };
let uidN = 0;
const newId = () => 'c' + Date.now().toString(36) + (uidN++).toString(36);
const defTrans = (o = {}) => Object.assign({ dur: 1.6, stagger: 0.55, cascade: 0.3, order: 'rnd', axis: 'x', overlap: 0, ease: 'cubic', match: 'auto', seed: 1 }, o);
const defImage = (o = {}) => Object.assign({ src: 'sample', width: 32, threshold: 128, invert: false }, o);
function makeClip(type, o = {}) {
  const c = { id: newId(), type, enabled: true, hold: 1.5 };
  if (type === 'text') c.text = 'NEW TEXT';
  if (type === 'cipher') Object.assign(c, { text: '', mode: 'scramble', shift: 3, seed: 7, flicker: 8 });
  Object.assign(c, o);

const defLook = () => ({ snap: false, seams: false, uniform: true, align: 'bottom', roundUp: true, assign: 'center', gap: 0 });
function defaultScene() {
  return {
    version: 1, name: 'Example scene', look: defLook(),
    clips: [
      makeClip('image', { hold: 1.2, trans: { dur: 2.2 } }),
      makeClip('text', { text: 'HELLO WORLD', hold: 1.8, trans: { dur: 1.2, order: 'sweep', stagger: 0.6 } }),
      makeClip('cipher', { hold: 1.6, trans: { dur: 2, stagger: 0.5 } }),
      makeClip('text', { text: 'PIXEL\nCOLLAPSE', hold: 1.6, trans: { dur: 2.2 } }),
      makeClip('squares', { hold: 0.8, trans: { dur: 2.4, stagger: 0.6 } }),
      makeClip('bigsquare', { hold: 2 }),

function normalizeScene(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.clips)) throw new Error('This file is not a Pixel Collapse scene (no clips list found).');

    const base = makeClip(c.type);
    const out = Object.assign(base, c);
    if (typeof out.id !== 'string' || seen.has(out.id)) out.id = newId();
    seen.add(out.id);
    out.enabled = out.enabled !== false;
    out.hold = num(out.hold, 1.5, 0, 120);
    out.trans = defTrans(c.trans || {});
    out.trans.dur = num(out.trans.dur, 1.6, 0.05, 120);
    if (c.type === 'image') out.image = defImage(c.image || {});
    if (c.type === 'text' || c.type === 'cipher') out.text = String(out.text ?? '');
    return out;
  });
  if (!clips.length) throw new Error('The scene has no usable blocks.');
  return { version: 1, name: String(o.name || 'Untitled scene').slice(0, 80), look: Object.assign(defLook(), o.look || {}), clips };
}

const STORE = 'pc-scene-v1';
let S;
try { const raw = localStorage.getItem(STORE); S = raw ? normalizeScene(JSON.parse(raw)) : null; } catch (e) { S = null; }
if (!S) S = defaultScene();
let sel = null; // {kind:'clip'|'trans', id}
const clipIndex = id => S.clips.findIndex(c => c.id === id);

// ================= text / cipher sources =================
const CIPH = '!#$%&*+<=>?@0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function encipher(src, c, tick) {

    const k = Math.round(c.shift) + tick;
    const rot = (code, base, n) => String.fromCharCode(base + (((code - base + k) % n) + n) % n);

function nearestText(i, types) {

  if (c.type === 'cipher') return encipher(cipherBase(i), c, tick);
  const k = nearestText(i, ['text', 'cipher']);
  return k >= 0 ? clipString(k, 0) : '';

// ================= grid helpers =================
function packGrid(items, s) {
  const N = items.length;
  const byY = items.slice().sort((a, b) => a.y - b.y || a.x - b.x);
  for (let r = 0; r < s; r++) {
    const band = byY.slice(Math.floor(r * N / s), Math.floor((r + 1) * N / s)).sort((a, b) => a.x - b.x || a.y - b.y);

    band.forEach((it, j) => { it.col = Math.floor(j * s / k); it.row = r; });

  const filled = [...occ.entries()].map(([k, it]) => ({ r: Math.floor(k / s), c: k % s, it }));
  for (let r = 0; r < s; r++) for (let c = 0; c < s; c++) {

  }
  return clones;
}

// ================= layouts (point sets) =================
const LC = new Map();
function memo(key, fn) { if (LC.has(key)) return LC.get(key); const v = fn(); v.key = key; LC.set(key, v); if (LC.size > 400) LC.delete(LC.keys().next().value); return v; }
const lookKey = () => JSON.stringify(S.look);

function layoutText(str) {
  return memo('T' + str, () => {
    const lines = str.replace(/\t/g, '  ').split('\n').map(l => [...l]);
    const rows = lines.length, cols = Math.max(1, ...lines.map(l => l.length));
    const top = -Math.round(rows * 16 / 2), pts = [], groups = [];
    lines.forEach((line, li) => {

    if (!c.enabled) { items.push({ kind: 'off', i, x0: x, x1: x + 26, t0: t, t1: t }); x += 26; return; }
    const w = c.hold * k;
    items.push({ kind: 'clip', i, x0: x, x1: x + w, t0: t, t1: t + c.hold }); x += w; t += c.hold;
    if (enIdx[enIdx.length - 1] !== i) { const w2 = c.trans.dur * k; items.push({ kind: 'trans', i, x0: x, x1: x + w2, t0: t, t1: t + c.trans.dur }); x += w2; t += c.trans.dur; }
  });
  const width = x + 80;
  let h = `<div class="ruler" data-k="ruler"></div>`;
  const step = k >= 120 ? 0.25 : k >= 50 ? 0.5 : 1;
  for (let s = 0; s <= total + 1e-6; s += step) {
    const major = Math.abs(s - Math.round(s)) < 1e-6;
    const tx = s >= total ? (items.filter(it => it.t1 > it.t0).pop() || { x1: 0 }).x1 : tToX(s);
    h += `<div class="tick${major ? '' : ' minor'}" style="left:${tx}px">${major ? Math.round(s) + 's' : ''}</div>`;
  }
  for (const it of items) {
    const c = S.clips[it.i], w = Math.max(2, it.x1 - it.x0);
    const isSelClip = sel && sel.kind === 'clip' && sel.id === c.id, isSelTr = sel && sel.kind === 'trans' && sel.id === c.id;
    if (it.kind === 'clip') h += `<div class="blk clip${isSelClip ? ' sel' : ''}" data-k="clip" data-i="${it.i}" style="left:${it.x0}px;width:${w}px" title="${esc(TYPES[c.type])}: ${esc(snippet(it.i))}"><div class="bt">${esc(TYPES[c.type])}</div><div class="bs">${esc(snippet(it.i))}</div><div class="bd">${c.hold.toFixed(1)}s</div><div class="grip" data-grip="hold"></div></div>`;
    else if (it.kind === 'off') h += `<div class="blk off${isSelClip ? ' sel' : ''}" data-k="off" data-i="${it.i}" style="left:${it.x0}px;width:${w}px" title="${esc(TYPES[c.type])} (off)"><div class="bt">${esc(TYPES[c.type])} off</div></div>`;
    else h += `<div class="blk trans${isSelTr ? ' sel' : ''}" data-k="trans" data-i="${it.i}" style="left:${it.x0}px;width:${w}px" title="Transition ${c.trans.dur.toFixed(1)}s"><div class="bd">${c.trans.dur.toFixed(1)}s</div><div class="grip" data-grip="dur"></div></div>`;
  }
  h += `<div class="phead" id="phead"></div><div class="drop" id="drop" hidden></div>`;
  track.innerHTML = h;
  track.style.width = width + 'px';
  updatePlayhead();
}
function updatePlayhead() {
  const ph = $('phead'); if (ph) ph.style.left = tToX(Math.min(tl, total - 1e-6)) + 'px';
  $('tout').textContent = tl.toFixed(2) + ' / ' + total.toFixed(2) + 's';
}

let drag = null;
track.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const r = track.getBoundingClientRect(), x = e.clientX - r.left;
  const grip = e.target.closest('.grip'), blk = e.target.closest('.blk');
  track.setPointerCapture(e.pointerId);
  if (grip && blk) {
    const i = +blk.dataset.i, c = S.clips[i], field = grip.dataset.grip;
    drag = { mode: 'resize', i, field, x0: e.clientX, v0: field === 'hold' ? c.hold : c.trans.dur };
    select(field === 'hold' ? 'clip' : 'trans', c.id, false);
    return;
  }
  if (blk && (blk.dataset.k === 'clip' || blk.dataset.k === 'off')) { drag = { mode: 'press', i: +blk.dataset.i, x0: e.clientX, el: blk }; return; }
  if (blk && blk.dataset.k === 'trans') { const c = S.clips[+blk.dataset.i]; select('trans', c.id, true); drag = null; return; }
  drag = { mode: 'scrub' }; scrubTo(x);
});
track.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = track.getBoundingClientRect(), x = e.clientX - r.left;
  if (drag.mode === 'resize') {
    const v = Math.max(0.1, Math.round((drag.v0 + (e.clientX - drag.x0) / pps()) * 10) / 10);
    const c = S.clips[drag.i];
    if (drag.field === 'hold') c.hold = v; else c.trans.dur = v;
    rebuild(); syncInspectorValues();
    const g = track.querySelector(`.blk[data-i="${drag.i}"][data-k="${drag.field === 'hold' ? 'clip' : 'trans'}"] .grip`); if (g) g.classList.add('on');
  } else if (drag.mode === 'press' || drag.mode === 'move') {
    if (drag.mode === 'press' && Math.abs(e.clientX - drag.x0) < 5) return;
    drag.mode = 'move';
    const el = track.querySelector(`.blk[data-i="${drag.i}"]:not(.trans)`); if (el) el.classList.add('dragging');
    const cl = items.filter(it => it.kind !== 'trans' && it.i !== drag.i);
    let idx = cl.findIndex(it => x < (it.x0 + it.x1) / 2); if (idx < 0) idx = cl.length;
    drag.target = idx;
    const d = $('drop'); d.hidden = false;
    d.style.left = (idx < cl.length ? cl[idx].x0 : (cl.length ? items[items.length - 1].x1 : 0)) - 1 + 'px';
  } else if (drag.mode === 'scrub') scrubTo(x);
});
const endDrag = () => {
  if (!drag) return;
  if (drag.mode === 'press') { const c = S.clips[drag.i]; select('clip', c.id, true); }
  else if (drag.mode === 'move' && drag.target !== undefined) {
    const c = S.clips.splice(drag.i, 1)[0];
    S.clips.splice(drag.target, 0, c);
    sel = { kind: 'clip', id: c.id };
    rebuild(); renderInspector();
  } else if (drag.mode === 'resize') renderTimeline();
  drag = null;
};
track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);
function scrubTo(x) { playing = false; tl = Math.max(0, Math.min(total, xToT(x))); syncPlay(); updatePlayhead(); }

function select(kind, id, seek) {
  sel = { kind, id };
  if (seek) {
    const i = clipIndex(id), it = items.find(it => it.i === i && (kind === 'trans' ? it.kind === 'trans' : it.kind !== 'trans'));
    if (it && it.t1 > it.t0) { tl = it.t0 + 1e-4; updatePlayhead(); }
  }
  renderTimeline(); renderInspector();
}

// ================= inspector =================
const opt = (v, cur, label) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${label}</option>`;
function rng(path, label, v, min, max, step, fmt = 's') {
  return `<div class="row"><label for="f-${path}">${label}</label><output data-out="${path}" data-fmt="${fmt}">${fmtVal(v, fmt)}</output><input type="range" id="f-${path}" data-path="${path}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
}
function fmtVal(v, f) { v = +v; return f === 's' ? v.toFixed(1) + 's' : f === '%' ? Math.round(v * 100) + '%' : f === 'px' ? v + ' px' : f === '/s' ? (v ? v + '/s' : 'off') : String(v); }
function sel_(path, label, cur, opts) { return `<div class="row"><label for="f-${path}">${label}</label><select id="f-${path}" data-path="${path}">${opts.map(o => opt(o[0], cur, o[1])).join('')}</select></div>`; }
function chk(path, label, v) { return `<label class="check"><input type="checkbox" id="f-${path}" data-path="${path}"${v ? ' checked' : ''}> ${label}</label>`; }

function renderInspector() {
  const ins = $('insp');
  let h = `<h1>Pixel Collapse</h1>`;
  const i = sel ? clipIndex(sel.id) : -1;
  if (i < 0) sel = null;
  if (sel && sel.kind === 'clip') {
    const c = S.clips[i];
    h += `<div class="group"><div class="label"><span>${esc(TYPES[c.type])} · block ${i + 1}</span></div>`;
    h += chk('clip.enabled', 'Enabled (off = skipped in playback)', c.enabled);
    h += rng('clip.hold', 'Hold', c.hold, 0, 10, 0.1);
    if (c.type === 'text') h += `<textarea id="f-clip.text" data-path="clip.text" spellcheck="false" aria-label="Text">${esc(c.text)}</textarea><div class="hint">Line breaks allowed. Latin-1 characters.</div>`;
    if (c.type === 'cipher') {
      h += `<textarea id="f-clip.text" data-path="clip.text" spellcheck="false" aria-label="Source text" placeholder="Empty = encrypt the previous text block">${esc(c.text)}</textarea>`;
      h += sel_('clip.mode', 'Cipher', c.mode, [['scramble', 'Scramble'], ['shift', 'Letter shift'], ['hex', 'Hex codes']]);
      if (c.mode === 'shift') h += rng('clip.shift', 'Shift by', c.shift, -13, 13, 1, 'n');
      if (c.mode === 'scramble') h += `<div class="row"><label for="f-clip.seed">Seed</label><button data-act="reseedClip">New seed</button></div>`;
      if (c.mode !== 'hex') h += rng('clip.flicker', 'Flicker while holding', c.flicker, 0, 30, 1, '/s');
      h += `<div class="hint">Shows: ${esc(clipString(i).replace(/\n/g, ' / '))}</div>`;
    }
    if (c.type === 'image') {
      h += `<div class="btns"><button data-act="loadImg">Load image</button><button data-act="sampleImg">Use sample</button></div><div class="hint">Or drop an image onto the canvas.</div>`;
      h += rng('clip.image.width', 'Width', c.image.width, 8, 160, 1, 'px');
      h += rng('clip.image.threshold', 'Threshold', c.image.threshold, 1, 254, 1, 'n');
      h += chk('clip.image.invert', 'Invert (black shapes on white)', c.image.invert);
    }
    if (c.type === 'squares' || c.type === 'bigsquare') h += `<div class="hint">Built from the nearest text or cipher block: “${esc(clipString(i).replace(/\n/g, ' / ') || 'none')}”. Square settings are under Look.</div>`;
    h += `<div class="btns"><button data-act="left" aria-label="Move earlier">◀ Move</button><button data-act="right" aria-label="Move later">Move ▶</button><button data-act="dup">Duplicate</button><button data-act="del">Delete</button></div></div>`;
  } else if (sel && sel.kind === 'trans') {
    const c = S.clips[i], en = S.clips.map((d, k) => d.enabled ? k : -1).filter(k => k > i), j = en[0];
    h += `<div class="group"><div class="label"><span>Transition · ${esc(TYPES[c.type])} ${i + 1} → ${j !== undefined ? esc(TYPES[S.clips[j].type]) + ' ' + (j + 1) : 'end'}</span></div>`;
    h += rng('trans.dur', 'Duration', c.trans.dur, 0.1, 10, 0.1);
    h += rng('trans.stagger', 'Stagger spread', c.trans.stagger, 0, 0.95, 0.01, '%');
    h += rng('trans.cascade', 'Group cascade', c.trans.cascade, 0, 1, 0.01, '%');
    h += `<div class="hint">Stagger spread = share of the duration used to offset start times. Group cascade = how much whole letters or squares go one after another.</div>`;
    h += sel_('trans.order', 'Stagger order', c.trans.order, [['rnd', 'Random'], ['sweep', 'Left → right'], ['down', 'Top → bottom'], ['center', 'Center out'], ['edge', 'Edges in']]);
    h += sel_('trans.axis', 'Axis order', c.trans.axis, [['x', 'X then Y'], ['y', 'Y then X'], ['alt', 'Alternate'], ['rnd', 'Random']]);
    h += rng('trans.overlap', 'Axis overlap', c.trans.overlap, 0, 1, 0.05, '%');
    h += sel_('trans.ease', 'Easing', c.trans.ease, [['cubic', 'Cubic in-out'], ['quad', 'Quad in-out'], ['expo', 'Expo in-out'], ['linear', 'Linear']]);
    h += sel_('trans.match', 'Pixel matching', c.trans.match, [['auto', 'Auto'], ['letters', 'Letter by letter'], ['rows', 'By rows'], ['random', 'Random']]);
    h += `<div class="hint">Auto: letters collapse into their own squares, squares move as units into the big square (center out when order is Random), same-shaped texts morph letter by letter, everything else by rows.</div>`;
    h += `<div class="btns"><button data-act="reseedTr">New random seed</button></div></div>`;
  } else {
    h += `<div class="hint">Select a block or a transition in the timeline to edit it.</div>`;
  }
  const L = S.look;
  h += `<div class="group"><div class="label"><span>Look</span></div>`;
  h += chk('look.snap', 'Snap to pixel grid', L.snap) + chk('look.seams', 'Show pixel seams', L.seams);
  h += sel_('look.uniform', 'Square size', L.uniform ? '1' : '0', [['1', 'Uniform (duplicate to fill)'], ['0', 'Natural ⌊√N⌋']]);
  h += sel_('look.align', 'Square alignment', L.align, [['bottom', 'Baseline'], ['center', 'Center'], ['top', 'Top']]);
  h += sel_('look.roundUp', 'Big square grid', L.roundUp ? '1' : '0', [['1', 'Round up (duplicate to fill)'], ['0', 'Round down (overlap)']]);
  h += sel_('look.assign', 'Big square build', L.assign, [['center', 'Center out'], ['grid', 'Grid packing']]);
  h += rng('look.gap', 'Gap between squares', L.gap, 0, 4, 1, 'px') + `</div>`;
  h += `<div class="group"><div class="label"><span>Scene</span></div>`;
  h += `<input type="text" id="f-scene.name" data-path="scene.name" value="${esc(S.name)}" aria-label="Scene name">`;
  h += `<div class="btns"><button data-act="save">Save JSON</button><button data-act="load">Load JSON</button><button data-act="copy">Copy JSON</button><button data-act="reset">Example scene</button></div>`;
  h += `<div class="status" id="status" role="status"></div><div class="hint">The current scene is also kept in this browser automatically.</div></div>`;
  ins.innerHTML = h;
}
function syncInspectorValues() {
  const i = sel ? clipIndex(sel.id) : -1; if (i < 0) return;
  const c = S.clips[i];
  [['clip.hold', c.hold], ['trans.dur', c.trans.dur]].forEach(([p, v]) => {
    const inp = document.getElementById('f-' + p), out = document.querySelector(`[data-out="${p}"]`);
    if (inp) inp.value = v; if (out) out.textContent = fmtVal(v, out.dataset.fmt);
  });
}
function targetFor(path) {
  const [root, ...rest] = path.split('.');
  let o = root === 'look' ? S.look : root === 'scene' ? S : null;
  if (root === 'clip' || root === 'trans') { const c = S.clips[clipIndex(sel.id)]; o = root === 'clip' ? c : c.trans; }
  for (let k = 0; k < rest.length - 1; k++) o = o[rest[k]];
  return [o, rest[rest.length - 1]];
}
$('insp').addEventListener('input', e => {
  const el = e.target, path = el.dataset.path; if (!path || !sel && !/^(look|scene)/.test(path)) return;
  const [o, k] = targetFor(path);
  let v = el.type === 'checkbox' ? el.checked : el.type === 'range' ? parseFloat(el.value) : el.value;
  if (path === 'look.uniform' || path === 'look.roundUp') v = v === '1';
  o[k] = v;
  const out = document.querySelector(`[data-out="${path}"]`); if (out) out.textContent = fmtVal(v, out.dataset.fmt);
  if (path.startsWith('look')) { LC.clear(); MC.clear(); }
  rebuild();
  if (el.tagName === 'SELECT' && path === 'clip.mode' || path === 'clip.enabled') renderInspector();
});
$('insp').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = sel ? clipIndex(sel.id) : -1, c = S.clips[i];
  if (act === 'del' && c) { S.clips.splice(i, 1); if (!S.clips.length) S.clips.push(makeClip('text')); sel = null; rebuild(); renderInspector(); }
  else if (act === 'dup' && c) { const d = JSON.parse(JSON.stringify(c)); d.id = newId(); S.clips.splice(i + 1, 0, d); sel = { kind: 'clip', id: d.id }; rebuild(); renderInspector(); }
  else if ((act === 'left' || act === 'right') && c) { const j = i + (act === 'left' ? -1 : 1); if (j < 0 || j >= S.clips.length) return; S.clips.splice(i, 1); S.clips.splice(j, 0, c); rebuild(); renderInspector(); }
  else if (act === 'reseedClip' && c) { c.seed = (Math.random() * 1e6) | 0; rebuild(); renderInspector(); }
  else if (act === 'reseedTr' && c) { c.trans.seed = (Math.random() * 1e6) | 0; rebuild(); }
  else if (act === 'loadImg') { $('imgFile').click(); }
  else if (act === 'sampleImg' && c) { c.image.src = 'sample'; c.image.invert = false; LC.clear(); rebuild(); renderInspector(); }
  else if (act === 'save') saveScene();
  else if (act === 'load') $('sceneFile').click();
  else if (act === 'copy') copyScene();
  else if (act === 'reset') { S = defaultScene(); sel = null; tl = 0; LC.clear(); MC.clear(); rebuild(); renderInspector(); status('Loaded the example scene.'); }
});
function status(msg) { const s = $('status'); if (s) s.textContent = msg; }

// ---- add blocks ----
document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
  const type = b.dataset.add, c = makeClip(type);
  const i = sel ? clipIndex(sel.id) : -1, at = i >= 0 ? i + 1 : S.clips.length;
  S.clips.splice(at, 0, c);
  sel = { kind: 'clip', id: c.id };
  rebuild(); renderInspector();
  const it = items.find(it => it.i === at && it.kind === 'clip'); if (it) { tl = it.t0 + 1e-4; updatePlayhead(); }
}));

// ---- images ----
function loadImageFile(f, clip) {
  if (!f || !/^image\//.test(f.type)) { status('That file is not an image. Use a PNG, JPG, GIF or WebP.'); return; }
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const sc = Math.min(1, 400 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const src = c.toDataURL('image/png');
    const s = sampleImage(c, clip.image.width); let lit = 0;
    for (let i = 0; i < s.d.length; i += 4) if (0.299 * s.d[i] + 0.587 * s.d[i + 1] + 0.114 * s.d[i + 2] >= clip.image.threshold && s.d[i + 3] >= 128) lit++;
    clip.image.invert = lit > s.gw * s.gh * 0.5;
    clip.image.src = src;
    URL.revokeObjectURL(url);
    LC.clear(); rebuild(); renderInspector(); status('Loaded ' + f.name);
  };
  im.onerror = () => status('Could not read that image. Try a PNG or JPG.');
  im.src = url;
}
$('imgFile').addEventListener('change', e => {
  const i = sel ? clipIndex(sel.id) : -1, c = S.clips[i];
  if (c && c.type === 'image') loadImageFile(e.target.files[0], c);
  e.target.value = '';
});
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  let i = sel ? clipIndex(sel.id) : -1;
  if (i < 0 || S.clips[i].type !== 'image') i = S.clips.findIndex(c => c.type === 'image');
  if (i < 0) { S.clips.unshift(makeClip('image')); i = 0; }
  sel = { kind: 'clip', id: S.clips[i].id };
  loadImageFile(f, S.clips[i]);
});

// ---- scene files ----
let downloads = null;
try { window.claude?.use?.('downloads').then(d => { downloads = d; }).catch(() => { }); } catch (e) { }
const sceneJSON = () => JSON.stringify(S, null, 2);
const fileBase = () => (S.name || 'scene').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'scene';
async function saveScene() {
  const data = sceneJSON(), filename = fileBase() + '.json';
  if (downloads) {
    try { await downloads.save({ filename, data }); status('Saved ' + filename); }
    catch (err) { status(err && err.code === 'declined' ? 'Save cancelled.' : 'Saving is not available here. Use Copy JSON instead.'); }
    return;
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    status('Downloaded ' + filename);
  } catch (e) { status('Download blocked here. Use Copy JSON instead.'); }
}
function copyScene() {
  const data = sceneJSON();
  try {
    navigator.clipboard.writeText(data).then(() => status('Scene JSON copied.'), () => status('Copy was blocked. Use Save JSON instead.'));
  } catch (e) { status('Copy was blocked. Use Save JSON instead.'); }
}
$('sceneFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { S = normalizeScene(JSON.parse(rd.result)); sel = null; tl = 0; LC.clear(); MC.clear(); rebuild(); renderInspector(); status('Loaded ' + f.name); fitZoom(); }
    catch (err) { status('Could not load ' + f.name + ': ' + (err.message || 'invalid JSON')); }
  };
  rd.readAsText(f);
});
document.addEventListener('paste', e => {
  if (e.target.closest('textarea, input')) return;
  const txt = e.clipboardData && e.clipboardData.getData('text');
  if (!txt || txt.trim()[0] !== '{') return;
  try { S = normalizeScene(JSON.parse(txt)); sel = null; tl = 0; LC.clear(); MC.clear(); rebuild(); renderInspector(); status('Loaded the pasted scene.'); }
  catch (err) { status('Pasted text is not a valid scene.'); }
});

// ================= transport =================
let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, tl = 0, last = performance.now();
function syncPlay() { $('play').textContent = playing ? 'Pause' : 'Play'; }
$('play').onclick = () => { if (!playing && tl >= total) tl = 0; playing = !playing; syncPlay(); };
$('restart').onclick = () => { tl = 0; playing = true; syncPlay(); };
$('zoom').addEventListener('input', renderTimeline);
function fitZoom() { const w = $('tlscroll').clientWidth - 90; $('zoom').value = Math.max(20, Math.min(300, Math.floor(w / Math.max(1, total)))); renderTimeline(); }
$('fit').onclick = fitZoom;
window.addEventListener('keydown', e => {
  if (e.target.closest('textarea, input, select')) return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel && sel.kind === 'clip') { e.preventDefault(); const b = document.createElement('button'); b.dataset.act = 'del'; $('insp').appendChild(b); b.click(); b.remove(); }
});
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && total > 0) {
    tl += dt;
    if (tl >= total) { if ($('loop').checked) tl %= total; else { tl = total; playing = false; syncPlay(); } }
    updatePlayhead();
  }
  draw(Math.min(tl, Math.max(0, total - 1e-6)));
  requestAnimationFrame(frame);
}

new ResizeObserver(resize).observe(stage);
resize();
rebuild();
fitZoom();
renderInspector();
syncPlay();
requestAnimationFrame(frame);
</script>

</body>
</html>
